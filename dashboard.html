<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="TSwpMs6zuNhf5JGzXF4Q032x8Ew56y1QKba4pf7GyZg" />
    <title>Dashboard - GlobalKurs</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        :root { --bg: #0b1121; --surface: rgba(30, 41, 59, 0.6); --primary: #3b82f6; --text: #f8fafc; --muted: #94a3b8; --up: #10b981; --down: #ef4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        nav { padding: 1.5rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(11, 17, 33, 0.8); backdrop-filter: blur(10px); }
        .logo { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; color: var(--text); text-decoration: none; }
        .logo span.material-icons-outlined { color: var(--primary); font-size: 2rem; }
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a { color: var(--muted); text-decoration: none; font-weight: 600; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        .container { padding: 3rem 5%; flex: 1; }
        .header { margin-bottom: 2rem; }
        .header h2 { font-size: 2rem; font-weight: 700; }
        .header p { color: var(--muted); margin-top: 0.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
        .card { background: var(--surface); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 1.5rem; backdrop-filter: blur(10px); transition: transform 0.3s; display: flex; flex-direction: column; gap: 1rem; }
        .card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.15); }
        .card-top { display: flex; justify-content: space-between; align-items: center; }
        .country-info { display: flex; align-items: center; gap: 0.8rem; }
        .emoji { font-size: 2rem; }
        .currency-name { font-weight: 600; font-size: 1.1rem; }
        .currency-code { color: var(--muted); font-size: 0.9rem; }
        .rate { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; }
        .indicator { padding: 0.4rem 0.8rem; border-radius: 8px; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 0.3rem; width: fit-content; transition: 0.3s; }
        .indicator.up { background: rgba(16, 185, 129, 0.1); color: var(--up); border: 1px solid rgba(16, 185, 129, 0.2); }
        .indicator.down { background: rgba(239, 68, 68, 0.1); color: var(--down); border: 1px solid rgba(239, 68, 68, 0.2); }
        footer { text-align: center; padding: 2rem; border-top: 1px solid rgba(255,255,255,0.05); color: var(--muted); margin-top: auto; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo"><span class="material-icons-outlined">currency_exchange</span> GlobalKurs</a>
        <div class="nav-links">
            <a href="index.html">Beranda</a>
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="analythics.html">Analitik</a>
        </div>
    </nav>
    <div class="container">
        <div class="header">
            <h2>Pantauan Pasar Utama</h2>
            <p>Nilai tukar langsung terhadap Rupiah (IDR). Pembaruan otomatis aktif</p>
        </div>
        <div class="grid" id="market-grid">
            <!-- Kartu di-generate oleh JS -->
        </div>
    </div>
    <footer>
        <p>&copy; 2026 GlobalKurs Analytics. | <a href="terms.html" style="color:var(--primary);text-decoration:none;">Syarat</a> | <a href="privacy.html" style="color:var(--primary);text-decoration:none;">Privasi</a></p>
    </footer>

    <script>
        // Data simulasi profesional
        let currencies = [
            { name: "US Dollar", code: "USD", rate: 15650.00, change: 0.45, emoji: "🇺🇸" },
            { name: "Euro", code: "EUR", rate: 16980.50, change: -0.21, emoji: "🇪🇺" },
            { name: "Pound Sterling", code: "GBP", rate: 19850.75, change: 0.85, emoji: "🇬🇧" },
            { name: "Japanese Yen", code: "JPY", rate: 104.30, change: -1.15, emoji: "🇯🇵" },
            { name: "Singapore Dollar", code: "SGD", rate: 11620.00, change: 0.12, emoji: "🇸🇬" },
            { name: "Saudi Riyal", code: "SAR", rate: 4172.50, change: 0.05, emoji: "🇸🇦" },
            { name: "Australian Dollar", code: "AUD", rate: 10230.40, change: -0.60, emoji: "🇦🇺" },
            { name: "Chinese Yuan", code: "CNY", rate: 2175.20, change: -0.30, emoji: "🇨🇳" }
        ];

        function formatIDR(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(number);
        }

        function renderGrid() {
            const grid = document.getElementById('market-grid');
            grid.innerHTML = '';
            
            currencies.forEach(c => {
                const isUp = c.change >= 0;
                const changeClass = isUp ? 'up' : 'down';
                const icon = isUp ? 'trending_up' : 'trending_down';
                const sign = isUp ? '+' : '';

                const cardHTML = `
                    <div class="card">
                        <div class="card-top">
                            <div class="country-info">
                                <span class="emoji">${c.emoji}</span>
                                <div>
                                    <div class="currency-name">${c.name}</div>
                                    <div class="currency-code">${c.code} / IDR</div>
                                </div>
                            </div>
                        </div>
                        <div class="rate">${formatIDR(c.rate)}</div>
                        <div class="indicator ${changeClass}">
                            <span class="material-icons-outlined" style="font-size:1.2rem;">${icon}</span>
                            ${sign}${c.change.toFixed(2)}%
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // Render awal
        renderGrid();

        // Simulasi pergerakan pasar (efek live trade) setiap 3 detik
        setInterval(() => {
            currencies.forEach(c => {
                // Fluktuasi acak antara -0.15% hingga +0.15%
                const volatility = (Math.random() - 0.5) * 0.3; 
                c.change += volatility;
                c.rate += c.rate * (volatility / 100);
            });
            renderGrid();
        }, 3000);
    </script>
</body>
</html>
